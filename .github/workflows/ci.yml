name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: bash syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script in bin/
        run: |
          set -e
          fail=0
          for f in bin/*; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q '^#!.*bash'; then
              continue
            fi
            echo "→ $f"
            if ! bash -n "$f"; then
              echo "  FAIL: $f"
              fail=1
            fi
          done
          # Also check the embedded meta-skill copies
          for f in skills/add-telemetry/telemetry/bin/*; do
            [ -f "$f" ] || continue
            if ! head -1 "$f" | grep -q '^#!.*bash'; then
              continue
            fi
            echo "→ $f"
            if ! bash -n "$f"; then
              echo "  FAIL: $f"
              fail=1
            fi
          done
          exit $fail

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: shellcheck bin/
        # SC1090/SC1091: dynamic source paths (we resolve them at runtime).
        # SC2155: declare-and-assign (already widespread in this codebase).
        # SC2086: word-splitting on $VARS — we use this intentionally for
        # parameter lists. Loosen to warning so CI doesn't block.
        run: |
          set -e
          fail=0
          for f in bin/*; do
            [ -f "$f" ] || continue
            head -1 "$f" | grep -q '^#!.*bash' || continue
            echo "→ $f"
            shellcheck -S error -e SC1090,SC1091 "$f" || fail=1
          done
          exit $fail

  smoke:
    name: end-to-end smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install jq
        run: sudo apt-get install -y jq
      - name: run smoke tests
        run: |
          chmod +x bin/* tests/*.sh
          ./tests/smoke.sh

  worker-syntax:
    name: dashboard worker syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: parse worker.js + local.js
        # Worker code uses CF-specific globals (fetch, KV bindings). Just
        # check it parses — a real deploy would use `wrangler deploy --dry-run`.
        run: |
          node --check dashboard/worker.js
          node --check dashboard/local.js

  local-dashboard:
    name: local dashboard demo boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install jq
        run: sudo apt-get install -y jq
      - name: boot demo mode + smoke the API
        # This is the path a tweet-driven user hits: cd dashboard && npm run demo.
        # If a refactor breaks `node local.js` startup, we want CI to know.
        run: |
          set -e
          cd dashboard
          # Use a non-default port so we don't collide with anything.
          PORT=18801 SKILL_TELEMETRY_DEMO=1 node local.js &
          SERVER_PID=$!
          # Give the server time to bind. Timeout-loop is more robust than sleep.
          for i in $(seq 1 30); do
            if curl -fs -o /dev/null http://127.0.0.1:18801/api/dau; then
              echo "✓ server up after ${i}× polls"
              break
            fi
            sleep 0.2
          done
          # Assert the API returns demo data
          rows=$(curl -fs http://127.0.0.1:18801/api/dau | jq 'length')
          echo "demo /api/dau returned $rows rows"
          test "$rows" -gt 0
          # Assert the HTML loads
          curl -fs -o /dev/null http://127.0.0.1:18801/
          echo "✓ HTML loads"
          # Assert DNS-rebinding defense: malicious Host header → 421
          status=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: evil.com" http://127.0.0.1:18801/)
          test "$status" = "421" || (echo "DNS rebinding defense regressed; got HTTP $status" && exit 1)
          echo "✓ DNS rebinding defense holds (HTTP 421)"
          kill $SERVER_PID 2>/dev/null || true

  deno-check:
    name: edge function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      - name: deno check
        run: deno check supabase/functions/skill-telemetry-ingest/index.ts
